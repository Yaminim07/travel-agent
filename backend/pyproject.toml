[tool.poetry]
name = "travel-agent-backend"
version = "0.1.0"
description = "Django backend for Travel Agent"
authors = ["Travel Agent Team <team@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
Django = "^4.2.16"
djangorestframework = "^3.15.2"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-django = "^4.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
